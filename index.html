<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Rushd Studio Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="layar-auth">
  <main class="kartu-auth">
    <div class="merek">
      <span class="logo">R</span>
      <div>
        <h1>Rushd Studio Tracker</h1>
        <p class="sub">Pencatatan klien, proyek, dan invoice</p>
      </div>
    </div>

    <h2>Masuk</h2>
    <form id="form-login" novalidate>
      <label>Email
        <input type="email" name="email" required autocomplete="email" placeholder="nama@email.com" />
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••" />
      </label>
      <button type="submit">Masuk</button>
    </form>

    <p id="pesan" class="pesan" role="status" aria-live="polite"></p>

    <p class="ganti">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
